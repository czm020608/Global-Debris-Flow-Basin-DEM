[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "global-debris-flow-basin-dem"
version = "0.1.0"
description = "DEM workflow tools for global debris-flow basin analysis."
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pandas",
  "rasterio",
  "matplotlib",
  "openpyxl",
  "pyproj",
  "geopandas",
  "shapely",
]

[tool.setuptools.packages.find]
where = ["src"]

